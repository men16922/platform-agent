replicas: 4

# argoproj/rollouts-demo renders a solid color per tag (blue/yellow/red/…), so an
# update (blue→yellow) makes the canary weight visually obvious in the dashboard.
image:
  repository: argoproj/rollouts-demo
  tag: blue

# Metric-based canary judgment (AnalysisTemplate + Prometheus, see templates/analysis.yaml).
#
# LIVE-VERIFIED 2026-07-25 on kind, BOTH directions
# (docs/evidence/onprem-addons-rollouts-analysis-e2e.log):
#   bad canary  -> AnalysisRun Failed (failed 3 > failureLimit 2) -> auto-abort in
#                  ~105s with NO human action; stable ReplicaSet kept 4/4 serving.
#   good canary -> 3x Successful (value 0) -> NOT aborted; the manual `pause: {}`
#                  gate still governs promote (so the Phase 4 demo is intact).
#
# Still default OFF: the Phase 4 manual promote/abort demo is the documented
# walkthrough, and flipping the default would change what that demo does. Enable
# per-environment through Terraform instead of editing this file:
#   terraform apply -var rollouts_demo_analysis_enabled=true
# `prometheusAddress` below was confirmed against the module's own Grafana
# datasource (kube-prometheus-stack names that Service from its chart helpers).
analysis:
  enabled: false
  templateName: rollouts-demo-canary-health
  prometheusAddress: http://monitoring-kube-prometheus-prometheus.monitoring.svc:9090
  # Abort once the canary pods have accumulated more than this many restarts.
  maxRestarts: 0
  # Skip the first measurement window so a normal container start is not a "restart".
  initialDelay: 30s
  interval: 30s
  # Consecutive failed measurements tolerated before the rollout aborts.
  failureLimit: 2

# Stage 2 — the AGENT as the release gate (AnalysisTemplate `web` provider calling
# the platform-agent canary judge). Complements, does not replace, the Prometheus
# metric above: one asks "is it crashing", the other asks the pipeline that
# handles incidents what it thinks of this release.
#
# Default OFF like stage 1, and additionally because it needs the webhook to be
# reachable FROM the cluster — set `url` to wherever the agent runs.
agentAnalysis:
  enabled: false
  templateName: rollouts-demo-agent-verdict
  url: http://pa-platform-agent-webhook.default.svc:8078/canary/judge
  # Deliberately generous: the judgement includes an LLM call (on the live run the
  # analyze span was ~4-5s), and a timeout here reads as a failed gate.
  timeoutSeconds: 30
  initialDelay: 30s
  interval: 60s
  failureLimit: 1
  # A canary-timescale alert rule ships with the gate (templates/prometheusrule.yaml).
  # kps's own pod rules use `for: 15m`, which never fires inside a canary window —
  # the gate would then read "no alerts" for a canary that is crashlooping and
  # promote it. See that file for the full reasoning.
  ruleFor: 30s
  ruleNamespace: monitoring          # where the kps Prometheus looks for rules
  ruleReleaseLabel: monitoring       # kps ruleSelector matchLabels release=<this>
