apiVersion: v2
name: rollouts-demo
description: >-
  Canary demo workload for Argo Rollouts (Phase 4). A single Rollout that pauses
  indefinitely at 50% weight so promote/abort can be driven live, plus its
  Service. Deployed after the argo-rollouts controller (depends_on) so the
  Rollout CRD exists.
type: application
# Bump on every chart change: the Terraform helm provider diffs chart metadata,
# not local file contents, so an edited template with an unchanged version is a
# silent no-op on `terraform apply`.
version: 0.2.0
appVersion: "1.9.1"
