# Low-footprint kube-prometheus-stack for local kind/k3s. Contract
# (guard-tested): every CPU request stays <= 50m. Storage is ephemeral
# (emptyDir) and retention short — this is a demo/ops-loop substrate, not a
# long-term TSDB. Control-plane component scrapes that are unreachable on
# kind/k3s (etcd/scheduler/controller-manager/kube-proxy) are disabled so the
# default rules don't fire permanent false-positive alerts.

kubeEtcd:
  enabled: false
kubeScheduler:
  enabled: false
kubeControllerManager:
  enabled: false
kubeProxy:
  enabled: false

prometheusOperator:
  resources:
    requests:
      cpu: 5m
      memory: 64Mi

prometheus:
  prometheusSpec:
    retention: 12h
    resources:
      requests:
        cpu: 10m
        memory: 384Mi
    # Phase 4a — ship a *measured* slice to Amazon Managed Prometheus.
    #
    # ⚠️ The allowlist is the cost control, not a nicety. This cluster carries
    # **52,438 series / 5.14B samples per month**; shipping it unfiltered costs
    # **≥$180/mo**, which is what 4b costs — i.e. it erases the reason 4a was
    # chosen. The four metrics below are **308 series, 0.59% of the cluster**.
    # Rationale and the exclusion list live in
    # `docs/plans/2026-08-15-4a-remote-write-allowlist.md` — do not widen this
    # regex without re-reading §4: passing *all* of kube-state-metrics is 4,188
    # series → $16.28/mo, three times the approved budget.
    #
    # ⚠️ The regex is anchored by Prometheus (`^(?:…)$`), not a prefix match.
    #
    # Credentials: a k8s Secret holding an IAM user whose entire policy is
    # `aps:RemoteWrite` on **this one workspace** — created 2026-08-17 because
    # kind has no IRSA and the operator identity (`q-user`) can terminate EC2.
    # 자격증명이 경계 (D38·D39): the pipe gets a key that can do nothing else.
    # The Secret is never in git; see the plan's §8.
    remoteWrite:
      - url: https://aps-workspaces.ap-northeast-2.amazonaws.com/workspaces/ws-929b8da9-b0db-49f8-aadb-2ed1a70f699f/api/v1/remote_write
        sigv4:
          region: ap-northeast-2
          accessKey:
            name: amp-remote-write
            key: access_key_id
          secretKey:
            name: amp-remote-write
            key: secret_access_key
        writeRelabelConfigs:
          - sourceLabels: [__name__]
            regex: 'kube_pod_container_status_restarts_total|kube_pod_status_phase|kube_deployment_status_replicas_unavailable|up'
            action: keep

alertmanager:
  alertmanagerSpec:
    resources:
      requests:
        cpu: 5m
        memory: 32Mi
  # Route every alert into the platform-agent Day-2 loop (in-cluster webhook →
  # detect→analyze→decide→execute). The Watchdog heartbeat is dropped — it is a
  # meta-alert that always fires and would spam the incident pipeline.
  config:
    route:
      receiver: platform-agent
      group_by: ["alertname", "namespace"]
      group_wait: 10s
      group_interval: 1m
      repeat_interval: 12h
      routes:
        - receiver: "null"
          matchers:
            - alertname = "Watchdog"
    receivers:
      - name: "null"
      - name: platform-agent
        webhook_configs:
          - url: ${webhook_url}
            send_resolved: false

# Demo rule for the live E2E: fires within ~2-3 min once a pod in the default
# namespace crash-loops (much faster than the stock KubePodCrashLooping's 15m).
additionalPrometheusRulesMap:
  platform-agent-demo:
    groups:
      - name: platform-agent.demo
        rules:
          - alert: PlatformDemoCrashLoop
            expr: increase(kube_pod_container_status_restarts_total{namespace="default"}[5m]) > 2
            for: 1m
            labels:
              severity: warning
            annotations:
              summary: "Pod {{ $labels.pod }} in {{ $labels.namespace }} is crash-looping"
              description: "Container {{ $labels.container }} restarted more than twice in 5m."

grafana:
  resources:
    requests:
      cpu: 5m
      memory: 96Mi
  # Phase 5/6: register Loki and Tempo so metrics (Prometheus), logs (Loki) and
  # traces (Tempo) share one Grafana. URLs are the in-cluster Services from
  # values/loki.yaml and values/tempo.yaml.
  additionalDataSources:
    - name: Loki
      type: loki
      uid: loki
      access: proxy
      url: http://loki-gateway.monitoring.svc
      isDefault: false
    - name: Tempo
      type: tempo
      uid: tempo
      access: proxy
      # 3200 is Tempo 2.x's http_listen_port (query API + metrics). NOT 3100 —
      # that is the pre-2.x default and this chart's Service does not expose it
      # (verified with `helm template`); 4317 is OTLP ingest, also not this.
      url: http://tempo.monitoring.svc:3200
      isDefault: false

kube-state-metrics:
  resources:
    requests:
      cpu: 5m
      memory: 32Mi
  # 60s here rather than a global `scrapeInterval: 60s`, because **287 of the
  # 308 remote-written series (93%) come from this one ServiceMonitor** and the
  # other 21 are each job's `up` (measured 2026-08-17). Interval is a *cost*
  # handle — raising it globally would also halve the resolution of metrics
  # that cost nothing because the allowlist never ships them.
  #
  #   global 60s               13.3M/mo  $1.20   ⚠️ whole lab loses resolution
  #   this ServiceMonitor 60s  15.8M/mo  $1.42   ← chosen
  #   unchanged (30s)          28.2M/mo  $2.54
  #
  # Safe for the loop it serves: object-state metrics change slowly, and the
  # demo alarm rule integrates over `[5m]`, i.e. five samples at this interval.
  prometheus:
    monitor:
      interval: 60s

prometheus-node-exporter:
  resources:
    requests:
      cpu: 5m
      memory: 16Mi
