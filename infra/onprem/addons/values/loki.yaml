# Low-footprint Loki for local kind/k3s (Phase 5 logging). SingleBinary mode +
# filesystem storage; every microservice/cache component is off so the whole
# add-on stack still fits the Docker VM budget. Contract (guard-tested): CPU
# requests stay <= 50m. Not for production scale — local log aggregation only.
deploymentMode: SingleBinary

loki:
  # PSS `restricted` requires seccompProfile at the pod level (or on every
  # container), and this chart sets everything else PSS wants but not this. It
  # only began to matter when Phase 2 started labelling tenant namespaces
  # `enforce: restricted`: identical values install fine in `monitoring` (no PSS
  # label) and are refused in a tenant namespace. The refusal is quiet — ArgoCD
  # reported Synced/Progressing with ZERO pods, because a StatefulSet whose pods
  # admission rejects is still "synced". Pod level, not container level, so it
  # also covers sidecars this file does not enumerate (loki-sc-rules).
  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  limits_config:
    retention_period: 72h
    reject_old_samples: false
  # Silence the ruler/analytics extras that assume a hosted backend.
  rulerConfig:
    storage:
      type: local
  analytics:
    reporting_enabled: false

singleBinary:
  replicas: 1
  resources:
    requests:
      cpu: 20m
      memory: 128Mi
  persistence:
    enabled: true
    size: 1Gi
    storageClass: standard
    # Keep the volume when the StatefulSet goes away. The chart defaults this to
    # true, which renders `persistentVolumeClaimRetentionPolicy.whenDeleted:
    # Delete` — the opposite of Kubernetes' own default (Retain), and measured
    # live: deleting the tenant's logging Application removed the PVC and the
    # logs with it, in the same second, with no warning anywhere.
    #
    # That is the wrong default for this platform specifically. "Unsubscribe from
    # an add-on" is about to become a registry edit made through a dashboard PR
    # (Phase 5), and an edit that silently destroys a tenant's data is not a
    # deletion policy anyone chose — it is one inherited from a chart. Retained
    # volumes cost disk and can be reclaimed deliberately; destroyed logs cannot.
    enableStatefulSetAutoDeletePVC: false

# Scalable/microservice targets off — SingleBinary owns everything.
backend: { replicas: 0 }
read: { replicas: 0 }
write: { replicas: 0 }

# memcached caches default to multi-Gi requests — the classic local footprint
# trap. Off for local; SingleBinary serves queries directly.
chunksCache:
  enabled: false
resultsCache:
  enabled: false

gateway:
  enabled: true
  # PSS `restricted` requires seccompProfile at the pod level (or on every
  # container), and this chart sets everything else PSS wants but not this. It
  # only began to matter when Phase 2 started labelling tenant namespaces
  # `enforce: restricted`: identical values install fine in `monitoring` (no PSS
  # label) and are refused in a tenant namespace. The refusal is quiet — ArgoCD
  # reported Synced/Progressing with ZERO pods, because a StatefulSet whose pods
  # admission rejects is still "synced". Pod level, not container level, so it
  # also covers sidecars this file does not enumerate (loki-sc-rules).
  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault
  resources:
    requests:
      cpu: 5m
      memory: 16Mi

# Extras that pull more pods/charts — all off for a minimal local stack.
lokiCanary:
  enabled: false
test:
  enabled: false
monitoring:
  selfMonitoring:
    enabled: false
    grafanaAgent:
      installOperator: false
