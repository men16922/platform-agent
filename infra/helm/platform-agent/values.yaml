# Default values — safe-by-default: executor log-only, drain RBAC off, router off.
# Substrate overlays: values-kind.yaml / values-k3s.yaml (env x substrate axis).

image:
  repository: platform-agent
  tag: "0.1.0"
  # Set to "sha256:..." to deploy by digest instead of tag; it wins over `tag`.
  # A cosign signature covers a digest, so verifying a tag and deploying that
  # tag leaves a gap where the tag can move. Verify and pin the same digest:
  #   python scripts/verify_image_signature.py REPO@sha256:... --key cosign.pub
  digest: ""
  pullPolicy: IfNotPresent

# External model brain (never in-cluster). The kind overlay points this at the
# host MLX endpoint, mirroring infra/onprem/kagent/qwen-model-config.yaml.
llm:
  endpoint: "http://host.docker.internal:18091/v1"
  model: "mlx-community/Qwen3-Coder-30B-A3B-Instruct-4bit"

# Offline JSONL stores (activity / pending approvals / incidents). Single-writer
# by design: keep replicas at 1 per component. Setting stateStore (below) is the
# multi-replica path — then persistence can be disabled entirely.
persistence:
  enabled: true
  size: 1Gi
  storageClass: ""  # substrate overlays set this (kind: standard, k3s: local-path)
  mountPath: /data

# SQL State Store (roadmap ④, PLATFORM_STATE_DSN). Empty = JSONL mode, unchanged.
# Production: point existingSecret at a Secret holding the DSN (e.g. built from
# the aws-production Terraform module's Aurora endpoint + managed password) —
# never put a real DSN in a values file. `dsn` is the dev/kind convenience.
# With a store configured, set persistence.enabled=false and replicas > 1.
stateStore:
  dsn: ""
  existingSecret: ""
  secretKey: "dsn"

webhook:
  enabled: true
  port: 8078
  replicas: 1  # JSONL mode is single-writer; scale out only with stateStore set
  # Real kubectl remediation. false = log-only (product default). Flipping this
  # to true makes the Day-2 executor patch live workloads via the ServiceAccount.
  executorLive: false
  rbac:
    # Namespaced least-privilege for restart/undo/scale (verbs enumerated, no "*").
    enabled: true
    # Cluster-scoped drain rights (nodes cordon + pod eviction across namespaces).
    # Kept separate and off by default — grant only where polite drain is wanted.
    allowDrain: false
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "1", memory: 1Gi}

router:
  # The deploy front door builds/pushes images, which needs build tooling this
  # image intentionally does not carry (cloud paths use CodeBuild etc.). Enable
  # only for the SSE/routing/recording surface, or behind an external builder.
  enabled: false
  port: 8077
  replicas: 1
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "1", memory: 1Gi}

# ① stage 2 — the agent as an Argo Rollouts release gate (POST /canary/judge).
#
# The gate observes the canary itself rather than trusting the caller's claim
# about it. Empty = no alert source, and the gate then answers `unknown` for
# every canary, which BLOCKS promotion. That is the intended safe default: it
# fails visibly instead of approving releases it never looked at.
canaryGate:
  alertSource: ""   # e.g. http://monitoring-kube-prometheus-alertmanager.monitoring.svc:9093

# ⑥ Pod Security Standards `restricted` compliance for every workload this
# chart ships. ON by default: unlike the other opt-ins here, leaving this off is
# not a neutral choice — it is the state in which a namespace that later gets
# `pod-security.kubernetes.io/enforce: restricted` starts rejecting our pods.
# The namespace LABEL itself is Phase 2's job (Capsule creates those namespaces);
# this is the half that has to be true first.
#
# runAsUser/fsGroup match the UID/GID baked into infra/onprem/Dockerfile.
securityContext:
  enabled: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001

# ⑦ TTL sweeper CronJob — report-only backstop for the local watchdog, which
# cannot survive the machine it runs on. Default OFF: it needs provider CLIs and
# read-only cloud credentials that this chart deliberately does not assume.
#
# The honest failure mode is built in — with no credentials the sweeper exits 2
# ("coverage incomplete"), so the Job goes RED. It never reports a green
# all-clear it did not earn. Scope `providers` to the clouds you have actually
# wired up; leaving all three on a single-cloud install is a permanent red.
orphanSweeper:
  enabled: false
  schedule: "0 * * * *"
  # Age budget in minutes. A per-cluster `ttl-min` label overrides it.
  maxAgeMin: 1440
  providers: []          # e.g. ["gcp"] — empty means all three
  protect: []            # exact cluster names never to report
  # Defaults to the agent image, which carries no cloud CLIs. Point this at an
  # image that has the ones matching `providers`.
  image:
    repository: ""
    tag: ""
  env: []                # e.g. GCP_PROJECT / AWS_REGION, or credential mounts
  backoffLimit: 1
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}

# Extra env for either component, e.g. PLATFORM_MONTHLY_BUDGET_USD.
extraEnv: []
