{{- if .Values.webhook.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "platform-agent.fullname" . }}-webhook
  labels:
    {{- include "platform-agent.labels" . | nindent 4 }}
    app.kubernetes.io/component: webhook
spec:
  replicas: {{ .Values.webhook.replicas }}
  strategy:
    {{- include "platform-agent.strategy" . | nindent 4 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "platform-agent.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: webhook
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "platform-agent.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: webhook
    spec:
      serviceAccountName: {{ include "platform-agent.fullname" . }}
      {{- if .Values.securityContext.enabled }}
      securityContext:
        {{- include "platform-agent.podSecurityContext" . | nindent 8 }}
      {{- end }}
      containers:
        - name: webhook
          image: {{ include "platform-agent.image" . | quote }}
          {{- if .Values.securityContext.enabled }}
          securityContext:
            {{- include "platform-agent.containerSecurityContext" . | nindent 12 }}
          {{- end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - uvicorn
            - src.agents.ai.onprem_webhook_api:app
            - --host
            - "0.0.0.0"
            - --port
            - {{ .Values.webhook.port | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.webhook.port }}
          env:
            {{- include "platform-agent.storeEnv" . | nindent 12 }}
            {{- include "platform-agent.stateStoreEnv" . | nindent 12 }}
            - name: ONPREM_EXECUTOR_LIVE
              value: {{ .Values.webhook.executorLive | quote }}
            {{- if .Values.llm.endpoint }}
            # The analyzer's model backend. Without this the webhook silently runs
            # the heuristic fallback — which returns confidence 0.0, so every
            # canary judgement comes back `unknown` and the release gate can only
            # ever block. The value was already declared in values.yaml; only the
            # router consumed it, and the router is off by default.
            - name: ANALYZER_LLM_ENDPOINT
              value: {{ .Values.llm.endpoint | quote }}
            - name: ANALYZER_LLM_MODEL
              value: {{ .Values.llm.model | quote }}
            {{- end }}
            {{- if .Values.canaryGate.alertSource }}
            # Where the canary gate looks for alerts actually firing against the
            # canary. Unset means the gate cannot observe it, which returns
            # `unknown` (never `pass`) — an unobserved canary is not a quiet one.
            - name: CANARY_ALERT_SOURCE
              value: {{ .Values.canaryGate.alertSource | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          # Lenient liveness (process alive) vs strict readiness (circuit breaker
          # aware): /health/ready returns 503 while the breaker is OPEN so the
          # Service stops routing, without the kubelet killing the pod.
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.webhook.resources | nindent 12 }}
          {{- if .Values.persistence.enabled }}
          volumeMounts:
            - name: store
              mountPath: {{ .Values.persistence.mountPath }}
          {{- end }}
      {{- if .Values.persistence.enabled }}
      volumes:
        - name: store
          persistentVolumeClaim:
            claimName: {{ include "platform-agent.fullname" . }}-store
      {{- end }}
{{- end }}
