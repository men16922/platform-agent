# Second tenant — exists so cross-tenant isolation is testable (a single-tenant
# registry cannot falsify "tenant-A cannot reach tenant-B"), and so the shared
# `kind-platform-agent` cluster is genuinely multi-tenant under the soft tier.
isolation: soft
naming_prefix: globex

quota:
  cpu: "8"
  memory: 32Gi
  pods: 100

environments:
  dev:
    # Same cluster as acme/dev on purpose: soft tier means several tenants share
    # one cluster by namespace, so the credential boundary must be per-TENANT,
    # not per-env. A per-env kubeconfig here would reach acme's namespaces.
    cluster: kind-platform-agent
    substrate: kind
    delivery: argocd
    addons:
      # Managed, on purpose: two tenants share this cluster and only one of them
      # runs a self-hosted Prometheus. This is the declaration Phase 4a's DoD asks
      # for — until it existed, `expand_desired`'s managed branch had no caller and
      # the `applicable=false` axis had only ever been proven with a faked
      # descriptor. Nothing is installed for it; the read model reports it as
      # sync=n/a rather than the render pretending it is in sync.
      observability: amazon-managed-prometheus
