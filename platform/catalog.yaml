# Shared add-on catalog — the *capability* definitions every tenant draws from.
#
# Phase 0 of docs/plans/2026-07-21-multi-tenant-env-addons.md. This file declares
# WHAT a capability is and which backends can satisfy it; it never says which
# tenant gets it (that lives in tenants/<name>.yaml) and it never says HOW to
# install it (that is the delivery adapter's job).
#
# `wave` exists because Phase 1b hands add-on ownership from Terraform to GitOps,
# and Terraform's `depends_on` ordering disappears with it. The delivery adapters
# render this number into their own ordering primitive:
#   ArgoCD -> argocd.argoproj.io/sync-wave     Flux -> spec.dependsOn
# Lower waves reconcile first: 0 = CRDs/namespaces, 1 = platform add-ons, 2 = workloads.
#
# `scope` exists because a live run proved the obvious assumption wrong: rendering
# a capability once per tenant is only valid when the backend can actually run once
# per tenant. Applying a per-tenant `argo-rollouts` Application installed a SECOND
# cluster-scoped controller (ClusterRoleBinding, no --namespaced), and both
# controllers then reconciled the same Rollout objects — leader election is
# per-namespace, so both were leaders. Nothing errored; two controllers simply
# fought over every workload on the cluster.
#
#   scope: namespace  one installation per tenant namespace — safe to duplicate
#   scope: cluster    ONE installation per cluster, shared. Tenants consume it;
#                     what is per-tenant is the *instance* (a Prometheus CR, a
#                     Rollout), never the operator/CRDs underneath it.
#
# Delivery adapters refuse to render a cluster-scoped capability per tenant. That
# refusal is the point: the alternative is a duplicate that looks installed.
version: 1

capabilities:
  observability:
    description: Metrics + dashboards (Prometheus-compatible)
    wave: 1
    # Prometheus Operator owns cluster-wide CRDs; a second install fights the
    # first over CRD ownership. The per-tenant thing is a Prometheus/ServiceMonitor
    # instance, not the operator.
    scope: cluster
    backends:
      self_hosted: kube-prometheus-stack
      # Managed backends have no sync axis — see NormalizedAddonStatus.applicable.
      managed:
        aws: amazon-managed-prometheus
        gcp: google-managed-prometheus
        azure: azure-monitor-managed-prometheus
    # Baseline Helm values, POINTED AT rather than copied here. The same files are
    # what infra/onprem/addons installs today; a second copy would give the platform
    # two answers to "how is this configured" that drift apart with nothing failing —
    # the exact shape of the retired tenancy-netpol chart's bug.
    self_hosted_values: infra/onprem/addons/values/kube-prometheus-stack.yaml

  logging:
    description: Log aggregation and query
    wave: 1
    # No CRDs, no cluster controller — a per-tenant Loki is a normal deployment.
    scope: namespace
    backends:
      self_hosted: loki
      managed:
        aws: cloudwatch-logs
        gcp: cloud-logging
        azure: log-analytics
    # Baseline Helm values, POINTED AT rather than copied here. The same files are
    # what infra/onprem/addons installs today; a second copy would give the platform
    # two answers to "how is this configured" that drift apart with nothing failing —
    # the exact shape of the retired tenancy-netpol chart's bug.
    self_hosted_values: infra/onprem/addons/values/loki.yaml

  tracing:
    description: Distributed traces (OTLP ingest)
    wave: 1
    scope: namespace
    backends:
      self_hosted: tempo
      managed:
        aws: aws-xray
        gcp: cloud-trace
        azure: azure-monitor-traces
    # Baseline Helm values, POINTED AT rather than copied here. The same files are
    # what infra/onprem/addons installs today; a second copy would give the platform
    # two answers to "how is this configured" that drift apart with nothing failing —
    # the exact shape of the retired tenancy-netpol chart's bug.
    self_hosted_values: infra/onprem/addons/values/tempo.yaml

  progressive:
    description: Weighted/canary progressive delivery
    wave: 1
    # The one a live run caught: two controllers, same Rollouts, no error.
    scope: cluster
    backends:
      self_hosted: argo-rollouts
      # Cluster-side mechanism is identical on managed substrates — no managed variant.
      managed: {}
    # Baseline Helm values, POINTED AT rather than copied here. The same files are
    # what infra/onprem/addons installs today; a second copy would give the platform
    # two answers to "how is this configured" that drift apart with nothing failing —
    # the exact shape of the retired tenancy-netpol chart's bug.
    self_hosted_values: infra/onprem/addons/values/argo-rollouts.yaml

  gitops:
    description: Declarative sync from the git registry
    wave: 0
    # The engine that reconciles everything else cannot be reconciled per tenant.
    scope: cluster
    backends:
      self_hosted: argocd
      managed:
        gcp: config-sync
        azure: flux-extension
    # Baseline Helm values, POINTED AT rather than copied here. The same files are
    # what infra/onprem/addons installs today; a second copy would give the platform
    # two answers to "how is this configured" that drift apart with nothing failing —
    # the exact shape of the retired tenancy-netpol chart's bug.
    self_hosted_values: infra/onprem/addons/values/argocd.yaml

  tenancy:
    description: Namespace/quota isolation enforcement for the soft tier
    wave: 0
    # Capsule's webhooks intercept namespace admission cluster-wide; per tenant it
    # would be a tenancy operator arbitrating its own tenant.
    scope: cluster
    backends:
      self_hosted: capsule
      managed: {}
    # Baseline Helm values, POINTED AT rather than copied here. The same files are
    # what infra/onprem/addons installs today; a second copy would give the platform
    # two answers to "how is this configured" that drift apart with nothing failing —
    # the exact shape of the retired tenancy-netpol chart's bug.
    self_hosted_values: infra/onprem/addons/values/capsule.yaml
