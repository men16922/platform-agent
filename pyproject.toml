[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "platform-agent"
version = "0.1.0"
description = "AWS-native platform agent for provisioning, deployment validation, and autonomous operations"
# Measured 2026-08-30, not asserted. `>=3.11` had been an unverified claim since
# the file was written — AGENT_BRIEF and STATUS Risk 12② both flagged it twice as
# "아무도 확인한 적 없는 주장". It is false: on a fresh 3.11 venv with CI's exact
# install line the gate is **2 failed, 2300 passed**
#   · test_local_deploy_api  — SSE stream ends `error`, not `done`
#     (anyio: "Attempted to exit cancel scope in a different task")
#   · test_platform_collector::TestPusherCLI — StopIteration escapes the loop
# The confounder was eliminated: a fresh **3.13** venv resolving the *same*
# package versions (starlette 1.6.0, fastapi 0.141.1, pytest 9.1.1, anyio 4.14.2)
# is green at 2302 — so this is the interpreter, not dependency drift.
# Evidence: docs/evidence/requires-python-was-an-unverified-claim-and-it-was-false.log
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.34",
    "python-dotenv>=1.0",
    "structlog>=24.1",
    "requests>=2.31",
    "pyyaml>=6.0",
    "strands-agents>=1.0",
]

# PEP 621: each extra is a plain array under this one table. The previous
# `[project.optional-dependencies.<name>]` + `dependencies = [...]` shape was
# invalid metadata — latent until the reference #7 image ran `pip install .`.
[project.optional-dependencies]
# Every entry below is imported inside a `try: ... except ImportError:` that falls
# back to a *warning*, so an undeclared one does not fail an install — it ships an
# agent that is quietly missing a limb. Swept 2026-08-15 (see the observability
# note below: that lesson was learned for one package and the siblings were never
# counted). `tests/test_optional_dependencies_declared.py` now counts them.
gcp = [
    "google-adk>=1.0",
    "google-cloud-aiplatform>=1.90",   # vertexai — analyzer LLM
    "google-cloud-firestore>=2.16",    # analyzer/decision/executor — incident store
    "google-cloud-logging>=3.10",      # detector — log enrichment
    "google-cloud-monitoring>=2.19",   # detector — monitoring_v3 metrics
]
azure = [
    "agent-framework>=1.0",
    "azure-identity>=1.15",
    "azure-ai-projects>=1.0",
    "azure-cosmos>=4.6",               # analyzer/decision/executor — incident store
    "azure-monitor-query>=1.3",        # detector — Logs/Metrics query
    "openai>=1.30",                    # analyzer — AzureOpenAI, i.e. the LLM itself
]
# `mlx-lm` was listed here until 2026-09-01 and removed after measuring that
# nothing consumed the declaration:
#
#   * `src/` never imports `mlx_lm` — the agent talks to the MLX server over an
#     OpenAI-compatible HTTP endpoint, so the engine is a *process*, not an import.
#   * Nothing installed it this way. The machine's `.venv-mlx` held `mlx-lm` and
#     `mlx` but **not** `pydantic-ai-slim`, so it was never `pip install .[onprem]`
#     (measured 2026-08-30, `make-dev-up-launched-a-venv-nothing-created.log`).
#     `make mlx-setup` is the mechanism, and it installs into a venv that is
#     **deliberately separate** from this project's — an activated `.venv-mlx`
#     shadows pytest, which is why the Makefile picks its interpreter by probing.
#     So shipping mlx into the project env was not merely unused; it was contrary
#     to the separation the Makefile maintains on purpose.
#   * It was the whole reason `gate.yml` named `pydantic-ai-slim` inline rather
#     than asking for this extra — the same workaround shape the `serving` extra
#     was created to remove.
#
# ⚠️ Keeping it had gotten *worse*, not stale. At the declared floor the failure
# was loud: `mlx-lm==0.19.0` requires `mlx>=0.17.0` with **no platform marker**, so
# a linux resolve genuinely fails. Today's 0.31.3 requires
# `mlx>=0.31.2; platform_system == "Darwin"` and ships a `py3-none-any` wheel — it
# **installs on linux and the engine silently is not there** (re-measured
# 2026-09-01 off PyPI metadata). A CI runner would have gotten a green install of
# a package that cannot do the one thing it is for.
onprem = ["pydantic-ai-slim[openai]>=2.9"]
# `make dev-up` runs `uvicorn src.agents.ai.local_deploy_api:app` and the on-prem
# webhook the same way, and nothing declared either — a fresh clone cannot start
# the documented local stack.
serving = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
state = ["psycopg2-binary>=2.9"]
# Declared 2026-08-08, after the first CI run failed 17 tracing tests that pass on
# every developer machine. `strands-agents` already pulls opentelemetry api+sdk, so
# `find_spec("opentelemetry.sdk")` succeeded and the tests' skipif did NOT skip —
# but `tracing._build_tracer` imports the OTLP **exporter**, which nothing declared.
# Its ImportError is swallowed by the deliberate `except Exception: return None`
# (tracing must never break remediation), so tracing silently became a no-op and
# the spans the tests assert on were never emitted. The gate had been passing on an
# undeclared package that happened to be installed locally.
observability = [
    "opentelemetry-sdk>=1.24",
    "opentelemetry-exporter-otlp-proto-grpc>=1.24",
]
dev = [
    "pytest>=8.1",
    "pytest-asyncio>=0.23",
    "moto[cloudwatch,logs,ssm,stepfunctions]>=5.0",
    "ruff>=0.4",
    "mypy>=1.9",
]

[tool.ruff]
line-length = 100
target-version = "py313"   # same number as `requires-python`; test_pyproject_claims pins them together
# Vendored trees, declared rather than inferred. Both are gitignored and ruff
# respects .gitignore by default — but measured 2026-08-30, that inference is not
# deterministic here: the same `ruff check src/ tests/` on an unchanged tree
# alternated between 20 and 6,527 errors across repeated runs (the 6,507 extra all
# under src/stacks/cdk.out). `[tool.pytest.ini_options]` already names these two
# paths in `norecursedirs`; ruff named neither, so the same trap was blocked for
# one sibling and open for the other. Keep the two lists in step —
# `tests/test_vendored_paths_are_excluded_from_both_tools.py` fails if they drift.
extend-exclude = ["src/stacks/cdk.out", "src/stacks/node_modules"]

[tool.mypy]
# ⚠️ Declared and never run. Measured 2026-08-30: nothing in the Makefile, CI,
# scripts/, or a pre-commit hook invokes mypy — only `.mypy_cache/` in .gitignore
# and a CDK bundling exclusion mention it, and those are leftovers. `strict = true`
# reads to a newcomer as "this repo is mypy-strict"; it is 253 errors across 88 of
# 165 files away from that. Kept rather than deleted because the settings are the
# target, but the claim must not read as enforcement — whether mypy joins the gate
# is a decision for the repo, the same one `gate.yml` records for lint:
# "a CI job is a bad place to introduce a standard nobody agreed to."
# `tests/test_pyproject_claims.py` fails if this comment is removed while mypy is
# still uninvoked, so the gap stays visible instead of looking like a standard.
python_version = "3.13"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["src/stacks/cdk.out", "src/stacks/node_modules"]
asyncio_default_fixture_loop_scope = "function"
