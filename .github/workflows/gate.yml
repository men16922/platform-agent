# The gate, run by a machine instead of only by whoever remembered.
#
# Until 2026-08-08 this repo had no CI at all — `.github/workflows/` did not
# exist — while three documents described signature verification as running "CI
# 까지". That claim was measured and removed; this file is the other half of the
# fix, so the sentence can be true rather than deleted.
#
# `make check` is the same gate the overnight harness and the local Stop hook
# use. It is required to be offline and deterministic, which is what makes it
# runnable here at all.
name: gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          # tests/test_signature_gate_claims.py shells out to `git grep`, which
          # needs a real work tree — not a detached blob export.
          fetch-depth: 1

      # 3.13, because that is the version the gate is actually verified on.
      #
      # The first run used 3.11 — pyproject says `requires-python = ">=3.11"` — and
      # two tests failed there while passing on every developer machine (3.13):
      # test_platform_collector's sleep-interrupt raised `generator raised
      # StopIteration`, and test_local_deploy_api's SSE stream ended in `error`.
      # So `>=3.11` is a claim nothing has ever checked. Pinning the verified
      # version rather than quietly editing the floor: whether 3.11 is really
      # supported is a question about those tests, not about this file.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      # `pydantic-ai-slim` used to be named inline here, because the `onprem`
      # extra also pulled `mlx-lm`, which is Apple-Silicon only and could not
      # resolve on a linux runner. **That was true when it was written** and it is
      # not why the workaround is gone: `mlx-lm` was removed from the extra on
      # 2026-09-01 after measuring that nothing consumed the declaration at all
      # (`src/` never imports it; the machine's `.venv-mlx` had no
      # `pydantic-ai-slim` in it, so it was never `pip install .[onprem]`;
      # `make mlx-setup` is the mechanism, into a venv kept separate on purpose).
      # See the note above the extra in `pyproject.toml`.
      #
      # ⚠️ The old reason had also stopped being the *loud* failure it describes.
      # `mlx-lm==0.19.0` requires `mlx>=0.17.0` with no platform marker — a real
      # resolve failure. Today's 0.31.3 requires `mlx>=...; platform_system ==
      # "Darwin"` and ships a `py3-none-any` wheel, so this runner would have
      # installed it happily and simply had no engine. Removing the entry, rather
      # than relaxing the workaround, is what keeps that from being CI's problem.
      #
      # The ASGI stack used to be named inline too (`fastapi "uvicorn[standard]"`)
      # because **nothing declared it** — this file was carrying an undeclared
      # dependency so the gate would pass, while `pip install .` shipped an agent
      # that could not start the documented `make dev-up` stack (2026-08-15 sweep;
      # six such packages). It is declared now, so ask for it by name.
      #
      # The `serving` extra declares `uvicorn[standard]` — the same set this line
      # installed before — so this change removes the workaround **without**
      # changing what lands in the runner. `[standard]`'s packages are used by
      # uvicorn itself, not imported by our code, so grepping src/ cannot tell
      # you whether they matter; and CI cannot be run from here to find out.
      # One change at a time.
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,state,observability,serving,onprem]"

      # Without this the gate silently stops validating Terraform.
      #
      # Both `test_terraform_validate_passes` tests skip on
      # `terraform not installed OR module not initialised`, and this runner met
      # BOTH clauses: no terraform binary, and `.terraform/` is gitignored so a
      # fresh checkout is never initialised. The first CI run therefore reported
      # `1666 passed, 3 skipped` while every developer machine reported
      # `1668 passed, 1 skipped` — the two missing tests were exactly the two
      # that validate the IaC this repo deploys. A skip is not a failure, so the
      # gate that D43 made a merge condition looked green while checking less
      # than the machine it replaced.
      #
      # 1.15.8 is the version the modules are actually validated on locally,
      # pinned for the same reason python is pinned to 3.13 above.
      # `terraform_wrapper: false` keeps `terraform` a plain binary — the tests
      # invoke it through subprocess and parse its output.
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false

      # `-backend=false`: validation needs the providers, not remote state, so
      # this stays credential-free. Provider versions come from the committed
      # `.terraform.lock.hcl` files, which is what keeps the download pinned.
      # Only the two modules the tests actually read are initialised —
      # `infra/onprem/terraform` has no test asserting anything about it.
      - name: terraform init (validate targets only)
        run: |
          terraform -chdir=infra/terraform/aws-production init -backend=false -input=false
          terraform -chdir=infra/onprem/addons init -backend=false -input=false

      # `make check` only — that IS this repo's gate (Makefile: `check: test`).
      #
      # The first version of this file also ran `ruff check src/ tests/` and went
      # red on 399 findings. `make lint` is a real target but has never been part
      # of `check`, and it fails locally too (20 findings on this machine's ruff).
      # So that step was not enforcing the gate, it was silently widening it —
      # a CI job is a bad place to introduce a standard nobody agreed to. Whether
      # lint joins the gate is a decision for the repo, and it belongs in
      # `check:` where the harness and the Stop hook would honour it as well.
      - name: gate
        run: make check
